version: '3.8'

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sweety_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sweety Web Application
  sweety-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sweety-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:password123@postgres:5432/sweety_db
      JWT_SECRET: sweety-production-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
